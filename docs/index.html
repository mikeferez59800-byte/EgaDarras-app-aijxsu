
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="./">
    <title>EgaDarras 🩷 - Éducation sur le Consentement et l'Égalité</title>
    <meta name="description" content="Application pédagogique sur le consentement, l'égalité hommes-femmes et les stéréotypes de genre">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <meta name="theme-color" content="#FF69B4">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #F8F8FF;
            color: #2E2E2E;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            color: #FF69B4;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #555555;
        }
        .loading {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #FF69B4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        .feature {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .feature-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .feature-title {
            font-weight: 600;
            color: #2E2E2E;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EgaDarras 🩷</h1>
        <p>Application pédagogique sur le consentement, l'égalité hommes-femmes et les stéréotypes de genre</p>
        <div class="loading"></div>
        <p style="margin-top: 1rem; font-size: 0.9rem;">Chargement de l'application...</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">✋</div>
                <div class="feature-title">Consentement</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚖️</div>
                <div class="feature-title">Égalité</div>
            </div>
            <div class="feature">
                <div class="feature-icon">👥</div>
                <div class="feature-title">Stéréotypes</div>
            </div>
        </div>
    </div>
    
    <div id="root"></div>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('Service Worker enregistré:', registration);
                    })
                    .catch(error => {
                        console.log('Erreur Service Worker:', error);
                    });
            });
        }
    </script>
    
    <script src="./assets/bundle.js"></script>
</body>
</html>
